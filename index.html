<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KP Game</title>
    <meta name="description" content="Feed KP and make her happy!" />
    <meta name="author" content="KP Game" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- CRITICAL: Preload audio for instant playback (not prefetch - preload is higher priority) -->
    <link rel="preload" href="/music/rizz.mp4" as="fetch" crossorigin />
    <link rel="preload" href="/music/background.mp3" as="fetch" crossorigin />
    
    <!-- Prefetch lower priority assets (mourning, videos) -->
    <link rel="prefetch" href="/music/mourning.mp3" as="fetch" />
    <link rel="prefetch" href="/music/kpfall.mp4" as="fetch" />

    <!-- DNS prefetch and preconnect for fonts (fast font loading) -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta property="og:title" content="KP Game" />
    <meta property="og:description" content="Feed KP and make her happy!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@KPGame" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Prevent flash of unstyled content + critical CSS inline -->
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
      }
      /* Critical gradient for instant first paint */
      .game-gradient {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
