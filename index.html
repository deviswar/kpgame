<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KP Game</title>
    <meta name="description" content="Play the game & Make KP Happy!" />
    <meta name="author" content="KP Game" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Preload critical first-interaction audio (high priority) -->
    <link rel="preload" href="/music/rizz.mp3" as="audio" />
    <!-- Preload QT image for Rizz Scene (critical - shown immediately after rizz button click) -->
    <link rel="preload" href="/src/assets/qt-girl.jpg" as="image" type="image/jpeg" />
    <!-- Prefetch later audio (lower priority) -->
    <link rel="prefetch" href="/music/background.mp3" as="fetch" />
    <link rel="prefetch" href="/music/mourning.mp3" as="fetch" />
    <!-- kpfall.mp4 removed - will lazy load when needed -->

    <!-- DNS prefetch for fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta property="og:title" content="KP Game" />
    <meta property="og:description" content="Play the game & Make KP Happy!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://kpgtest.lovable.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@KPGame" />
    <meta name="twitter:image" content="https://kpgtest.lovable.app/og-image.png" />
    
    <!-- Prevent flash of unstyled content -->
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
