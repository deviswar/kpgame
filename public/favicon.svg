<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#ffd93d"/>
  
  <!-- Face -->
  <ellipse cx="32" cy="28" rx="18" ry="16" fill="#5a4535"/>
  
  <!-- Hair -->
  <ellipse cx="32" cy="18" rx="16" ry="8" fill="#1a1a1a"/>
  
  <!-- Eyes -->
  <ellipse cx="25" cy="28" rx="4" ry="3" fill="white"/>
  <ellipse cx="39" cy="28" rx="4" ry="3" fill="white"/>
  <circle cx="25" cy="28" r="2" fill="#1a1a1a"/>
  <circle cx="39" cy="28" r="2" fill="#1a1a1a"/>
  
  <!-- Nose -->
  <ellipse cx="32" cy="33" rx="2" ry="1" fill="rgba(0,0,0,0.15)"/>
  
  <!-- Smile -->
  <path d="M 26 38 Q 32 44 38 38" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Cheeks -->
  <ellipse cx="20" cy="34" rx="3" ry="2" fill="rgba(255,100,100,0.4)"/>
  <ellipse cx="44" cy="34" rx="3" ry="2" fill="rgba(255,100,100,0.4)"/>
  
  <!-- Pink ribbon -->
  <text x="44" y="18" font-size="14">🎀</text>
  
  <!-- Yellow collar hint -->
  <path d="M 20 44 Q 32 50 44 44" stroke="#f0c419" stroke-width="4" fill="none"/>
</svg>